name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - run: python -m unittest discover tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm test
        working-directory: worker
