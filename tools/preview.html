<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1600px;height:520px;background:transparent}
body{font-family:-apple-system,"SF Pro Text","Helvetica Neue",sans-serif;display:flex;align-items:center;justify-content:center}
.stage{width:1600px;height:520px;border-radius:28px;overflow:hidden;position:relative;
 background:radial-gradient(1200px 520px at 50% 30%,#1d232c 0%,#12161c 55%,#0b0e12 100%)}
.desk{position:absolute;left:0;right:0;bottom:0;height:200px;background:linear-gradient(#0b0e12 0%,#07090c 100%);border-top:1px solid #1e242c}
.wrap{position:absolute;left:50%;top:72px;transform:translateX(-50%)}
.brace{display:flex;gap:24px;margin:0 30px 18px;color:#8b95a3;font-size:17px;letter-spacing:.02em}
.brace div{border-top:2px solid #39424e;padding-top:10px;text-align:center;position:relative}
.brace .fixed{width:calc(256px*3 + 48px)} .brace .pool{width:calc(256px*2 + 24px);border-color:#5eead4;color:#5eead4}
.lamp{display:flex;gap:24px;padding:28px 30px;border-radius:22px;
 background:linear-gradient(180deg,#26292f 0%,#15171b 40%,#0d0e11 100%);
 box-shadow:0 1px 0 #3a3f47 inset,0 -1px 0 #000 inset,0 40px 60px -20px rgba(0,0,0,.8),0 2px 0 #000}
.scr{width:256px;height:256px;border-radius:6px;overflow:hidden;background:#000;
 box-shadow:0 0 0 3px #050506,0 0 0 4px #2b2f36}
.scr img{width:256px;height:256px;image-rendering:pixelated;display:block}
.cap{display:flex;gap:24px;margin:30px 30px 0;color:#c7ced8;font-size:19px;font-weight:600}
.cap div{width:256px;text-align:center}
.cap span{display:block;color:#6b7585;font-weight:500;font-size:15px;margin-top:6px}
.glow{position:absolute;left:50%;top:200px;width:1300px;height:300px;transform:translateX(-50%);
 background:radial-gradient(closest-side,rgba(94,234,212,.08),transparent);pointer-events:none}
</style></head><body><div class="stage"><div class="glow"></div>
<div class="wrap">
 <div class="brace"><div class="fixed">Always on screen</div><div class="pool">Drawn at random every 5 min</div></div>
 <div class="lamp">
  <div class="scr"><img src="../out/screen1.png"></div><div class="scr"><img src="screen2.png"></div>
  <div class="scr"><img src="../out/screen3.png"></div><div class="scr"><img src="screen4.png"></div>
  <div class="scr"><img src="../out/screen5.png"></div></div>
 </div></div></body></html>
